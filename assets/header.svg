<svg xmlns="http://www.w3.org/2000/svg" width="900" height="200" viewBox="0 0 900 200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0B0D1A"/>
      <stop offset="50%" style="stop-color:#0D1117"/>
      <stop offset="100%" style="stop-color:#0B0D1A"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00D9FF;stop-opacity:0"/>
      <stop offset="50%" style="stop-color:#00D9FF;stop-opacity:0.6"/>
      <stop offset="100%" style="stop-color:#00D9FF;stop-opacity:0"/>
    </linearGradient>
    <linearGradient id="accent2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FF2D95;stop-opacity:0"/>
      <stop offset="50%" style="stop-color:#FF2D95;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#FF2D95;stop-opacity:0"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glow-strong">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="900" height="200" fill="url(#bg)"/>
  
  <!-- Grid lines -->
  <g opacity="0.06" stroke="#00D9FF">
    <line x1="0" y1="40" x2="900" y2="40" stroke-width="0.5"/>
    <line x1="0" y1="80" x2="900" y2="80" stroke-width="0.5"/>
    <line x1="0" y1="120" x2="900" y2="120" stroke-width="0.5"/>
    <line x1="0" y1="160" x2="900" y2="160" stroke-width="0.5"/>
    <line x1="150" y1="0" x2="150" y2="200" stroke-width="0.5"/>
    <line x1="300" y1="0" x2="300" y2="200" stroke-width="0.5"/>
    <line x1="450" y1="0" x2="450" y2="200" stroke-width="0.5"/>
    <line x1="600" y1="0" x2="600" y2="200" stroke-width="0.5"/>
    <line x1="750" y1="0" x2="750" y2="200" stroke-width="0.5"/>
  </g>
  
  <!-- Accent lines -->
  <rect x="0" y="195" width="900" height="1" fill="url(#accent)"/>
  <rect x="0" y="0" width="900" height="1" fill="url(#accent2)" opacity="0.5"/>
  
  <!-- Corner accents -->
  <polyline points="20,10 10,10 10,30" fill="none" stroke="#00D9FF" stroke-width="1.5" opacity="0.4"/>
  <polyline points="880,10 890,10 890,30" fill="none" stroke="#00D9FF" stroke-width="1.5" opacity="0.4"/>
  <polyline points="20,190 10,190 10,170" fill="none" stroke="#FF2D95" stroke-width="1.5" opacity="0.3"/>
  <polyline points="880,190 890,190 890,170" fill="none" stroke="#FF2D95" stroke-width="1.5" opacity="0.3"/>
  
  <!-- Status indicator -->
  <circle cx="35" cy="30" r="3" fill="#27C93F" opacity="0.8"/>
  <text x="45" y="33" font-family="'Courier New', monospace" font-size="10" fill="#94A3B8" letter-spacing="2" opacity="0.5">SYS_ONLINE</text>
  
  <!-- Main name -->
  <text x="450" y="85" font-family="'Courier New', monospace" font-size="36" font-weight="bold" fill="#00D9FF" text-anchor="middle" filter="url(#glow)" letter-spacing="6">SHREYASH VAIGANKAR</text>
  
  <!-- Subtitle -->
  <text x="450" y="115" font-family="'Courier New', monospace" font-size="12" fill="#94A3B8" text-anchor="middle" letter-spacing="4">FULL-STACK DEV · IoT · SYSTEMS</text>
  
  <!-- Decorative line under subtitle -->
  <line x1="320" y1="130" x2="580" y2="130" stroke="url(#accent)" stroke-width="0.8"/>
  
  <!-- Bottom tagline -->
  <text x="450" y="155" font-family="'Courier New', monospace" font-size="10" fill="#FF2D95" text-anchor="middle" letter-spacing="2" opacity="0.7">MCA @ GOA UNIVERSITY · OPEN TO OPPORTUNITIES</text>
  
  <!-- Decorative dots -->
  <circle cx="280" cy="85" r="1.5" fill="#FF2D95" opacity="0.4"/>
  <circle cx="620" cy="85" r="1.5" fill="#FF2D95" opacity="0.4"/>
</svg>
